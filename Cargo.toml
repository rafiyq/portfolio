[package]
name = "portfolio-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
axum  = { version = "0.7", default-features = false, optional = true }
console_error_panic_hook = "0.1"
console_log = { version = "1.0", optional = true }
getrandom = { version = "0.2.15", features = ["js"] }
leptos = { version = "0.7", features = ["nightly"] }
leptos_axum = { version = "0.7", default-features = false, features = ["wasm"], optional = true }
leptos_meta = "0.7"
leptos_router = { version = "0.7", features = ["nightly"] }
log = "0.4"
tower-service = "0.3"
wasm-bindgen = "=0.2.99"
wasm-bindgen-futures = "0.4"
worker = { version= "0.5", features = ['http', 'axum', 'd1'], optional = true }

[features]
hydrate = ["dep:console_log", "leptos/hydrate"]
ssr = [ 
  "dep:axum",
  "dep:leptos_axum",
  "dep:worker",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]

[profile.release]
opt-level = "s"   # optimize for size in release builds
lto = true
strip = true
codegen-units = 1

[package.metadata.leptos]
# Compilation parameters. https://github.com/leptos-rs/cargo-leptos#compilation-parameters
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

# Site parameters. https://github.com/leptos-rs/cargo-leptos#site-parameters
output-name = "portfolio_app"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/output.css"
browserquery = "defaults"
assets-dir = "assets"
site-addr = "127.0.0.1:8787"
reload-port = 3001

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"